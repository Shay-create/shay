<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Social Rotator</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 400px;
    height: 150px;
    background: transparent;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }

  .stage {
    position: relative;
    width: 100%;
    height: 100%;
  }

  .card {
    position: absolute;
    inset: 10px;
    display: flex;
    align-items: center;
    gap: 18px;
    padding: 18px 22px;
    border-radius: 22px;
    background: rgba(255, 255, 255, 0.08);
    backdrop-filter: blur(15px) saturate(160%);
    -webkit-backdrop-filter: blur(15px) saturate(160%);
    border: 1px solid rgba(255, 255, 255, 0.22);
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, 0.35),
      inset 0 -1px 0 rgba(255, 255, 255, 0.05),
      0 8px 24px rgba(0, 0, 0, 0.25);
    opacity: 0;
    transform: translateY(6px);
    transition: opacity 700ms ease, transform 700ms ease;
    pointer-events: none;
  }

  .card::before {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 50%;
    border-radius: 22px 22px 0 0;
    background: linear-gradient(180deg, rgba(255,255,255,0.18), rgba(255,255,255,0));
    pointer-events: none;
  }

  .card.active {
    opacity: 1;
    transform: translateY(0);
  }

  .icon {
    flex: 0 0 auto;
    width: 70px;
    height: 70px;
    border-radius: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,0.3),
      0 6px 14px rgba(0,0,0,0.35);
    color: #fff;
    font-weight: 900;
  }

  .icon svg { width: 60%; height: 60%; }

  .text {
    display: flex;
    flex-direction: column;
    justify-content: center;
    color: #fff;
    text-shadow: 0 1px 2px rgba(0,0,0,0.45);
    overflow: hidden;
  }

  .platform {
    font-size: 22px;
    font-weight: 800;
    letter-spacing: 0.3px;
    line-height: 1.1;
  }

  .handle {
    margin-top: 4px;
    font-size: 16px;
    font-weight: 700;
    opacity: 0.92;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* Brand colors */
  .bg-tiktok    { background: #000; }
  .bg-youtube   { background: #FF0000; }
  .bg-instagram { background: linear-gradient(135deg,#feda75,#fa7e1e,#d62976,#962fbf,#4f5bd5); }
  .bg-x         { background: #000; }
  .bg-twitch    { background: #9146FF; }
  .bg-kick      { background: #53FC18; color:#000; }
  .bg-club      { background: #4B00FF; }
  .bg-beam      { background: linear-gradient(180deg,#dfeaff,#3aa0ff 55%,#0a1a3a); }

  .letter { font-size: 38px; font-weight: 900; }
</style>
</head>
<body>
  <div class="stage" id="stage"></div>

<script>
  const platforms = [
    { name: "TikTok",     handle: "@am_shay_",   bg: "bg-tiktok",
      svg: `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-5.2 1.74 2.89 2.89 0 0 1 2.31-4.64 2.93 2.93 0 0 1 .88.13V9.4a6.84 6.84 0 0 0-1-.05A6.33 6.33 0 0 0 5.8 20.1a6.34 6.34 0 0 0 10.86-4.43V8.81a8.16 8.16 0 0 0 4.77 1.52V6.89a4.85 4.85 0 0 1-1.84-.2z"/></svg>` },
    { name: "YouTube",    handle: "@shay..",     bg: "bg-youtube",
      svg: `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M9.5 15.5v-7l6 3.5-6 3.5z"/></svg>` },
    { name: "Instagram",  handle: "am_shayttv",  bg: "bg-instagram",
      svg: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1.2" fill="currentColor"/></svg>` },
    { name: "X",          handle: "AmSHAY_",     bg: "bg-x",
      svg: `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>` },
    { name: "Twitch",     handle: "am_shay",     bg: "bg-twitch",
      svg: `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 2 2.5 6v14h5v3h3l3-3h4l5-5V2H4zm16 11-3 3h-5l-3 3v-3H6V4h14v9zm-3-7h-2v6h2V6zm-5 0h-2v6h2V6z"/></svg>` },
    { name: "Kick",       handle: "shay",        bg: "bg-kick",
      svg: `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 3h5v5h2V5h2V3h5v5h-2v2h-2v4h2v2h2v5h-5v-2h-2v-3H8v5H3z"/></svg>` },
    { name: "Club",       handle: "shay",        bg: "bg-club",
      svg: `<span class="letter">C</span>` },
    { name: "Beamstream",  handle: "shay",        bg: "bg-beam",
      svg: `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M2 5h20L12 22z"/></svg>` }
  ];

  const stage = document.getElementById('stage');
  platforms.forEach((p, i) => {
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="icon ${p.bg}">${p.svg}</div>
      <div class="text">
        <div class="platform">${p.name}</div>
        <div class="handle">${p.handle}</div>
      </div>`;
    stage.appendChild(card);
    if (i === 0) card.classList.add('active');
  });

  const cards = document.querySelectorAll('.card');
  let idx = 0;
  setInterval(() => {
    cards[idx].classList.remove('active');
    idx = (idx + 1) % cards.length;
    cards[idx].classList.add('active');
  }, 15000);
</script>
</body>
</html>
